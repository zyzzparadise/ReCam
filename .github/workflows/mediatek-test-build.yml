name: MediaTek camera test build

on:
  push:
    branches:
      - fix/mediatek-nv21-and-fallback

permissions:
  contents: read

env:
  NDK_VERSION: 27.3.13750724

jobs:
  android:
    name: Android ARM64 test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Compile Android binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" NDK_PROJECT_PATH=android NDK_APPLICATION_MK=android/jni/Application.mk -j4
          python3 tools/release.py android --version v0.1.4
          tar -czf android-payload.tar.gz -C android/libs arm64-v8a
      - name: Upload Android ARM64 CLI and payload for Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-test
          path: |
            release/recam-cli-v0.1.4-android-arm64.zip
            android-payload.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 ReCam test
    needs: android
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-test
          path: action-artifact
      - name: Restore ARM64 binaries and install dependencies
        run: |
          set -euo pipefail
          mkdir -p android/libs
          tar -xzf action-artifact/android-payload.tar.gz -C android/libs
          python -m pip install --disable-pip-version-check PySide6==6.12.0 PyInstaller==6.22.3
      - name: Build Windows app with matching Android payload
        run: |
          set -euo pipefail
          python tools/package.py --no-ndk
          python tools/release.py desktop --version v0.1.4 --target windows-x64
      - name: Upload complete Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recam-mediatek-windows-x64
          path: release/ReCam-v0.1.4-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
